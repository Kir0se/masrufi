<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مصروفي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="icon" id="favIcon">
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #111114; --muted: #6e6e76; --line: #e3e3e8;
    --accent: #2f7d5b; --ok: #2f9e6a; --warn: #d98a00; --bad: #d63b3b; --chip: #ececf1;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d23; --text: #f2f2f5; --muted: #9a9aa4; --line: #2a2e36;
      --accent: #4fbf8b; --ok: #4fbf8b; --warn: #f0b03a; --bad: #ff6b6b; --chip: #262a32;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 520px; margin: 0 auto; -webkit-user-select: none; user-select: none;
  }
  input, select, button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
  header h1 { font-size: 28px; margin: 0; letter-spacing: -.3px; }
  .icon-btn { background: var(--card); border: 0; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow); font-size: 18px; cursor: pointer; }

  .card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }

  .summary { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 700; }
  .ring .pct small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); text-align: center; }
  .figures { flex: 1; min-width: 0; }
  .figures .label { color: var(--muted); font-size: 13px; }
  .figures .big { font-size: 32px; font-weight: 800; line-height: 1.15; margin: 2px 0 10px; }
  .figures .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .figures .row span:first-child { color: var(--muted); }

  .status { margin-top: 14px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }
  .status.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .status.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .status.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .alerts { margin-top: 8px; display: grid; gap: 6px; }
  .alerts div { font-size: 13px; color: var(--muted); padding-inline-start: 4px; }

  .daily { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .daily div { background: var(--chip); border-radius: 12px; padding: 10px; }
  .daily span { display: block; font-size: 12px; color: var(--muted); }
  .daily b { font-size: 17px; }

  .amount-wrap { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
  .amount-wrap input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 36px; font-weight: 800; outline: none; direction: ltr; text-align: right; }
  .amount-wrap .cur { color: var(--muted); font-size: 16px; }
  .note { width: 100%; margin-top: 12px; border: 0; background: var(--chip); border-radius: 12px; padding: 12px; outline: none; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { border: 0; background: var(--chip); padding: 8px 12px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); color: #fff; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
  .btn { border: 0; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.soft { background: var(--chip); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .btn:active { transform: scale(.98); }

  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 18px 4px 8px; }
  .list { padding: 4px 0; }
  .day { font-size: 12px; color: var(--muted); padding: 10px 18px 4px; }
  .tx { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .day + .tx { border-top: 0; }
  .tx .emo { width: 36px; height: 36px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; font-size: 18px; flex: none; }
  .tx .info { flex: 1; min-width: 0; }
  .tx .info b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .info span { font-size: 12px; color: var(--muted); }
  .tx .amt { font-weight: 700; font-size: 15px; }
  .tx .amt.inc { color: var(--ok); }
  .tx .del { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 4px 6px; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 14px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0;
           padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); z-index: 11; transform: translateY(105%); transition: transform .25s ease; max-height: 90vh; overflow: auto; }
  .sheet.open { transform: none; }
  .sheet h3 { margin: 0 0 14px; font-size: 20px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 6px; }
  .field input { width: 100%; border: 0; background: var(--card); border-radius: 12px; padding: 12px; font-size: 16px; outline: none; }
  .field small { display: block; color: var(--muted); font-size: 12px; margin: 6px 4px 0; }
  .sheet .btn { width: 100%; margin-top: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 10px); max-width: 488px; margin: 0 auto;
           padding: 14px 16px; border-radius: 14px; color: #fff; font-weight: 600; font-size: 15px; z-index: 20;
           transform: translateY(-150%); transition: transform .3s ease; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .toast.show { transform: none; }
  .toast.ok { background: var(--ok); } .toast.warn { background: var(--warn); } .toast.bad { background: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>مصروفي</h1>
  <button class="icon-btn" id="openSettings" aria-label="الإعدادات">⚙️</button>
</header>

<section class="card">
  <div class="summary">
    <div class="ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--chip)" stroke-width="12"/>
        <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="326.7" stroke-dashoffset="0" style="transition: stroke-dashoffset .5s ease, stroke .3s"/>
      </svg>
      <div class="pct"><div><span id="pct" class="num">100%</span><small>متبقي</small></div></div>
    </div>
    <div class="figures">
      <div class="label">المتبقي معك</div>
      <div class="big num" id="remaining">0</div>
      <div class="row"><span>الميزانية</span><span class="num" id="budgetOut">0</span></div>
      <div class="row"><span>صرفت</span><span class="num" id="spentOut">0</span></div>
    </div>
  </div>
  <div class="status ok" id="status">كل شيء تمام 👌</div>
  <div class="alerts" id="alerts"></div>
  <div class="daily" id="daily" hidden>
    <div><span>تقدر تصرف اليوم</span><b class="num" id="perDay">0</b></div>
    <div><span>صرفت اليوم</span><b class="num" id="today">0</b></div>
  </div>
</section>

<section class="card">
  <div class="amount-wrap">
    <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off">
    <span class="cur" id="curLabel">ليرة</span>
  </div>
  <div class="chips" id="cats"></div>
  <input id="customCat" class="note" placeholder="اكتب على شو صرفت" maxlength="30" autocomplete="off" hidden>
  <input id="note" class="note" placeholder="ملاحظة (اختياري)" maxlength="80" autocomplete="off">
  <div class="actions">
    <button class="btn primary" id="addExp">− أضف مصروف</button>
    <button class="btn soft" id="addInc" title="أضف رصيد">+ رصيد</button>
  </div>
</section>

<h2>السجل</h2>
<section class="card list" id="list"></section>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>الإعدادات</h3>
  <div class="field">
    <label>الميزانية (المبلغ اللي معك بالبداية)</label>
    <input id="setBudget" inputmode="decimal" placeholder="100">
  </div>
  <div class="field">
    <label>اسم العملة</label>
    <input id="setCur" placeholder="ليرة" maxlength="12">
  </div>
  <div class="field">
    <label>لازم يكفّي لغاية تاريخ (اختياري)</label>
    <input id="setEnd" type="date">
    <small>إذا حددته، بيحسب لك كم تقدر تصرف كل يوم وبينبهك إذا عم تصرف أسرع من اللازم.</small>
  </div>
  <button class="btn primary" id="saveSettings">حفظ</button>
  <button class="btn soft" id="newPeriod">بداية جديدة (يمسح السجل ويحتفظ بالإعدادات)</button>
  <div class="row2">
    <button class="btn soft" id="exportBtn">نسخة احتياطية</button>
    <button class="btn soft" id="importBtn">استرجاع</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button class="btn danger" id="closeSettings">إغلاق</button>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'masrufi.v1';
const CATS = [
  { id: 'food', emo: '🍔', name: 'أكل' },
  { id: 'transport', emo: '🚕', name: 'مواصلات' },
  { id: 'shop', emo: '🛍️', name: 'تسوق' },
  { id: 'bills', emo: '🧾', name: 'فواتير' },
  { id: 'fun', emo: '🎮', name: 'ترفيه' },
  { id: 'other', emo: '📦', name: 'أخرى' },
  { id: 'custom', emo: '✏️', name: 'غير ذلك' },
];
const BIG_EXPENSE = 0.20;   // single expense above 20% of the total is "big"
const LOW = 0.25, CRITICAL = 0.10;

const $ = id => document.getElementById(id);
let state = load();
let cat = 'food';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.txs)) return s;
  } catch (e) {}
  return { budget: 0, currency: 'ليرة', endDate: '', start: Date.now(), txs: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const fmt = n => {
  const r = Math.round(n * 100) / 100;
  return r.toLocaleString('en-US', { maximumFractionDigits: 2 });
};
const money = n => fmt(n) + ' ' + state.currency;
const parseNum = v => {
  // accept Arabic-Indic digits and both comma/dot decimal separators
  const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.').trim();
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
};
const dayKey = ts => new Date(ts).toDateString();
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

function totals() {
  let spent = 0, added = 0, today = 0;
  const todayKey = dayKey(Date.now());
  for (const t of state.txs) {
    if (t.type === 'inc') added += t.amt;
    else { spent += t.amt; if (dayKey(t.ts) === todayKey) today += t.amt; }
  }
  const total = state.budget + added;
  const remaining = total - spent;
  const pct = total > 0 ? remaining / total : 0;
  return { spent, added, total, remaining, pct, today };
}

function plan(t) {
  // daily allowance and pace, only when an end date is set
  if (!state.endDate) return null;
  const end = startOfDay(state.endDate + 'T00:00');
  const now = startOfDay(Date.now());
  const daysLeft = Math.round((end - now) / 86400000) + 1; // including today
  if (daysLeft <= 0) return { over: true };
  const spentBeforeToday = t.spent - t.today;
  const perDay = (t.total - spentBeforeToday) / daysLeft;
  const startDay = startOfDay(state.start);
  const totalDays = Math.max(1, Math.round((end - startDay) / 86400000) + 1);
  const elapsed = Math.min(1, (totalDays - daysLeft + 1) / totalDays);
  const spentRatio = t.total > 0 ? t.spent / t.total : 0;
  return { daysLeft, perDay, elapsed, spentRatio };
}

function render() {
  const t = totals();
  const p = plan(t);
  $('curLabel').textContent = state.currency;
  $('remaining').textContent = money(t.remaining);
  $('budgetOut').textContent = money(t.total);
  $('spentOut').textContent = money(t.spent);
  const pctShown = Math.max(0, Math.round(t.pct * 100));
  $('pct').textContent = pctShown + '%';

  let level = 'ok', msg = 'كل شيء تمام 👌';
  if (state.budget <= 0 && t.added <= 0) { level = 'warn'; msg = 'ابدأ بتحديد ميزانيتك من ⚙️'; }
  else if (t.remaining < 0) { level = 'bad'; msg = '🚨 تجاوزت الميزانية بـ ' + money(-t.remaining); }
  else if (t.pct <= CRITICAL) { level = 'bad'; msg = '🚨 خطر! باقي معك أقل من 10%'; }
  else if (t.pct <= LOW) { level = 'warn'; msg = '⚠️ انتبه، باقي معك أقل من ربع الميزانية'; }
  else if (p && !p.over && p.spentRatio > p.elapsed + 0.10) { level = 'warn'; msg = '⚠️ عم تصرف أسرع من اللازم'; }
  else if (t.pct <= 0.5) { msg = 'صرفت أكثر من النص، خفّف شوي 🙂'; }
  const st = $('status');
  st.className = 'status ' + level;
  st.textContent = msg;

  const color = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)' }[level];
  const arc = $('ringArc');
  arc.style.stroke = color;
  arc.style.strokeDashoffset = 326.7 * (1 - Math.min(1, Math.max(0, t.pct)));

  const alerts = [];
  if (p && p.over) alerts.push('📅 انتهت المدة اللي حددتها. ابدأ فترة جديدة من الإعدادات.');
  if (p && !p.over) {
    $('daily').hidden = false;
    $('perDay').textContent = money(Math.max(0, p.perDay));
    $('today').textContent = money(t.today);
    $('today').style.color = t.today > p.perDay ? 'var(--bad)' : '';
    if (t.today > p.perDay && p.perDay > 0) alerts.push('📈 صرفت اليوم أكثر من حصتك اليومية.');
    if (p.spentRatio > p.elapsed + 0.10) alerts.push('🏃 عم تصرف أسرع من المخطط: صرفت ' + Math.round(p.spentRatio * 100) + '% ومرّ ' + Math.round(p.elapsed * 100) + '% من المدة.');
    alerts.push('⏳ باقي ' + p.daysLeft + (p.daysLeft === 1 ? ' يوم' : ' أيام'));
  } else {
    $('daily').hidden = true;
  }
  $('alerts').innerHTML = alerts.map(a => '<div>' + a + '</div>').join('');

  renderList();
}

function renderList() {
  const list = $('list');
  if (!state.txs.length) { list.innerHTML = '<div class="empty">ما في مصاريف لسا</div>'; return; }
  const sorted = [...state.txs].sort((a, b) => b.ts - a.ts);
  const todayKey = dayKey(Date.now());
  const yKey = dayKey(Date.now() - 86400000);
  let html = '', last = '';
  for (const t of sorted) {
    const k = dayKey(t.ts);
    if (k !== last) {
      last = k;
      const label = k === todayKey ? 'اليوم' : k === yKey ? 'مبارح'
        : new Date(t.ts).toLocaleDateString('ar', { weekday: 'long', day: 'numeric', month: 'long' });
      html += '<div class="day">' + label + '</div>';
    }
    const c = CATS.find(x => x.id === t.cat) || CATS[CATS.length - 1];
    const isInc = t.type === 'inc';
    const name = isInc ? 'رصيد مضاف' : esc(t.label) || c.name;
    const time = new Date(t.ts).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });
    const sub = time + (t.note ? ' · ' + esc(t.note) : '');
    html += '<div class="tx">'
      + '<div class="emo">' + (isInc ? '💰' : c.emo) + '</div>'
      + '<div class="info"><b>' + name + '</b><span>' + sub + '</span></div>'
      + '<div class="amt num ' + (isInc ? 'inc' : '') + '">' + (isInc ? '+' : '−') + fmt(t.amt) + '</div>'
      + '<button class="del" data-id="' + t.id + '" aria-label="حذف">✕</button>'
      + '</div>';
  }
  list.innerHTML = html;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function toast(msg, level = 'ok') {
  const el = $('toast');
  el.className = 'toast ' + level;
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), level === 'ok' ? 1800 : 3500);
}

function add(type) {
  const amt = parseNum($('amount').value);
  if (!(amt > 0)) { toast('اكتب المبلغ أولاً', 'warn'); $('amount').focus(); return; }
  const custom = type === 'exp' && cat === 'custom' ? $('customCat').value.trim() : '';
  if (type === 'exp' && cat === 'custom' && !custom) { toast('اكتب على شو صرفت', 'warn'); $('customCat').focus(); return; }
  const before = totals();
  state.txs.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    type, amt, note: $('note').value.trim(), cat: type === 'inc' ? '' : cat, label: custom, ts: Date.now() });
  save();
  $('amount').value = ''; $('note').value = ''; $('customCat').value = '';
  const after = totals();
  render();

  if (type === 'inc') return toast('تمت إضافة ' + money(amt) + ' 💰');
  if (after.remaining < 0) return toast('🚨 تجاوزت الميزانية! ناقصك ' + money(-after.remaining), 'bad');
  if (before.total > 0 && amt >= before.total * BIG_EXPENSE)
    return toast('⚠️ مصروف كبير! هاد ' + Math.round(amt / before.total * 100) + '% من ميزانيتك', 'warn');
  if (before.pct > CRITICAL && after.pct <= CRITICAL) return toast('🚨 صار باقي معك أقل من 10%', 'bad');
  if (before.pct > LOW && after.pct <= LOW) return toast('⚠️ صار باقي معك أقل من الربع', 'warn');
  toast('تم ✓ باقي معك ' + money(after.remaining));
}

// categories
$('cats').innerHTML = CATS.map(c => '<button class="chip" data-cat="' + c.id + '">' + c.emo + ' ' + c.name + '</button>').join('');
function paintCats() {
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
  $('customCat').hidden = cat !== 'custom';
}
$('cats').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  cat = b.dataset.cat; paintCats();
  if (cat === 'custom') $('customCat').focus();
});
paintCats();

$('addExp').onclick = () => add('exp');
$('addInc').onclick = () => add('inc');
$('amount').addEventListener('keydown', e => { if (e.key === 'Enter') add('exp'); });
$('note').addEventListener('keydown', e => { if (e.key === 'Enter') add('exp'); });
$('customCat').addEventListener('keydown', e => { if (e.key === 'Enter') add('exp'); });

$('list').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (!b) return;
  const t = state.txs.find(x => x.id === b.dataset.id);
  if (t && confirm('حذف "' + (t.note || fmt(t.amt)) + '"؟')) {
    state.txs = state.txs.filter(x => x.id !== t.id);
    save(); render();
  }
});

// settings sheet
function openSheet() {
  $('setBudget').value = state.budget || '';
  $('setCur').value = state.currency;
  $('setEnd').value = state.endDate || '';
  $('sheetBg').style.display = 'block';
  requestAnimationFrame(() => $('sheet').classList.add('open'));
}
function closeSheet() {
  $('sheet').classList.remove('open');
  setTimeout(() => $('sheetBg').style.display = 'none', 250);
}
$('openSettings').onclick = openSheet;
$('closeSettings').onclick = closeSheet;
$('sheetBg').onclick = closeSheet;
$('saveSettings').onclick = () => {
  const b = parseNum($('setBudget').value);
  if (!(b >= 0)) return toast('الميزانية لازم تكون رقم', 'warn');
  state.budget = b;
  state.currency = $('setCur').value.trim() || 'ليرة';
  state.endDate = $('setEnd').value;
  save(); render(); closeSheet();
  toast('تم الحفظ ✓');
};
$('newPeriod').onclick = () => {
  if (!confirm('بدك تمسح كل السجل وتبدأ من جديد؟')) return;
  const b = parseNum($('setBudget').value);
  if (b >= 0) state.budget = b;
  state.txs = []; state.start = Date.now();
  state.endDate = $('setEnd').value;
  save(); render(); closeSheet();
  toast('بداية جديدة 🎉');
};
$('exportBtn').onclick = async () => {
  const data = JSON.stringify(state);
  const file = new File([data], 'masrufi-backup.json', { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.txs)) throw 0;
    state = s; save(); render(); closeSheet();
    toast('تم الاسترجاع ✓');
  } catch (err) { toast('الملف غير صالح', 'bad'); }
  e.target.value = '';
};

// home-screen icon drawn at runtime so the page stays a single file
(function icon() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180);
  g.addColorStop(0, '#3fae7d'); g.addColorStop(1, '#1f5f45');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 14;
  x.beginPath(); x.arc(90, 90, 56, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = '#fff'; x.lineCap = 'round';
  x.beginPath(); x.arc(90, 90, 56, -Math.PI / 2, Math.PI * 0.9); x.stroke();
  x.fillStyle = '#fff'; x.font = 'bold 54px -apple-system, Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('₤', 90, 94);
  const url = c.toDataURL('image/png');
  $('touchIcon').href = url; $('favIcon').href = url;
})();

if (!state.budget && !state.txs.length) setTimeout(openSheet, 300);
if (new URLSearchParams(location.search).has('add')) $('amount').focus();
render();
</script>
</body>
</html>
